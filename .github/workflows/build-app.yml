name: Build app

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Shows compile errors in the Dart code quickly. It does not stop the
      # build, so you still get the APK if only lint warnings are reported.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # arm64 only: the ExecuTorch Android prebuilt ships arm64-v8a only.
      # Retried because the prebuilt download can time out.
      - name: Build APK
        run: |
          n=0; until flutter build apk --release --target-platform android-arm64; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            echo "::warning::build failed (likely prebuilt download); retry $n"; sleep 20
          done

      - uses: actions/upload-artifact@v4
        with:
          name: demixr-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
